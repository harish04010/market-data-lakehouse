name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # a daily run against the real sources, so upstream breakage shows up here first

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -r requirements.txt
      - name: Tests (fixtures, no network), including Spark/DuckDB parity
        run: pytest -q
      - name: Live run against the real sources
        run: |
          python -m lake run
          python -m lake status
